name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    # 集成测试（SUBTITLE_CLI_INTEGRATION=1，需真实网络与 Cookie）不进 CI，本地手动跑
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: 同步依赖（按 uv.lock 锁定版本）
        run: uv sync --locked --extra dev

      - name: Lint（ruff）
        run: uv run ruff check .

      - name: 类型检查（mypy 门禁）
        run: uv run mypy

      - name: 测试 + 覆盖率
        run: |
          set -o pipefail
          uv run pytest -q --cov=subtitle_cli --cov-report=term-missing --cov-report=json --cov-fail-under=85 2>&1 | tee pytest-output.txt

      - name: 失败详情写进注解（免认证可读）
        if: failure()
        run: |
          {
            grep -E "^(FAILED|ERROR)" pytest-output.txt || true
            echo "--- tail ---"
            tail -n 35 pytest-output.txt
          } > failure-summary.txt
          python3 -c "
          import urllib.parse
          text = open('failure-summary.txt', encoding='utf-8', errors='replace').read()[:3500]
          lines = text.splitlines()
          n = (len(lines) + 2) // 3 or 1
          for i in range(3):
              chunk = '\n'.join(lines[i*n:(i+1)*n])
              if chunk.strip():
                  print('::error::' + urllib.parse.quote(chunk)[:3900])
          "

      - name: 覆盖率摘要（仅 3.13 报一次）
        if: matrix.python-version == '3.13'
        run: |
          PCT=$(uv run python -c "import json;print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          echo "Coverage: **${PCT}%**" >> "$GITHUB_STEP_SUMMARY"
