[project]
name = "subtitle-cli"
version = "0.1.0"
description = "B站合集字幕提取器：输入合集链接，一次性提取全部分集字幕为 Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
subtitle-cli = "subtitle_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 集成测试（真实网络请求）默认排除，仅 pytest -m integration 或显式覆盖时运行
addopts = "-m 'not integration'"
markers = [
    "integration: 真实接口端到端测试，需要网络且需设置 SUBTITLE_CLI_INTEGRATION=1",
]
