[project]
name = "subtitle-cli"
# 版本单源化：唯一来源是 src/subtitle_cli/__init__.py 的 __version__，此处动态读取
dynamic = ["version"]
description = "B站合集字幕提取器：输入合集链接，一次性提取全部分集字幕为 Markdown"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]
asr = ["faster-whisper>=1.0"]

[project.scripts]
subtitle-cli = "subtitle_cli.cli:app"
subtitle-cli-migrate = "subtitle_cli.migrate:app"
subtitle-cli-status = "subtitle_cli.status:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/subtitle_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_cli"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["demo_output", "output"]

[tool.ruff.lint]
# 中等档：默认规则（E4/E7/E9/F）+ bugbear + 裸异常 + RUF + 过时语法。
# 不开 import 排序（I）与格式化——不动现有代码风格
select = ["E4", "E7", "E9", "F", "B", "BLE", "RUF", "UP"]
ignore = [
    "RUF001", "RUF002", "RUF003", # 全中文注释/字符串：全角标点是正常用法，不是歧义字符
    "B008",  # typer 的 Option/Argument 写在参数默认值里是框架惯用法
]

[tool.mypy]
# 渐进收紧：当前为报告制（CI continue-on-error），先观察错误面再逐模块开启严格检查
python_version = "3.10"
files = ["src/subtitle_cli"]
plugins = ["pydantic.mypy"]
exclude = ["web", "demo"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 集成测试（真实网络请求）默认排除，仅 pytest -m integration 或显式覆盖时运行
addopts = "-m 'not integration'"
markers = [
    "integration: 真实接口端到端测试，需要网络且需设置 SUBTITLE_CLI_INTEGRATION=1",
]
